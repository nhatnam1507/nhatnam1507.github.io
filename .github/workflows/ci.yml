# Runs on every pull request (any base branch). Each check is its own step so
# a red step names the failure. Make "CV & site checks" a required status
# check on main (and on the migration integration branch) so nothing merges
# with an invalid CV, lint errors or failing tests (see README → CI/CD).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CV & site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Validate CV source of truth (src/content/profile.ts)
        run: npm run validate

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "### CV & site checks"
            echo ""
            echo "Steps: validate CV → format → lint → typecheck → unit tests → build."
            echo "A red step above names the failing check; lint and test failures are annotated on the PR diff."
          } >> "$GITHUB_STEP_SUMMARY"
