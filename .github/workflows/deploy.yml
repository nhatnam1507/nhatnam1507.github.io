# On every push to main: run the same checks as CI, build the static export
# and publish out/ to GitHub Pages. A weekly run keeps build-time dates (years
# of experience, "Present" roles) fresh between content changes.
# Requires Settings → Pages → Source: "GitHub Actions" (see README → CI/CD).
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; never cancel one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site & CV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Checks (CV validation, format, lint, typecheck, tests, build)
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
