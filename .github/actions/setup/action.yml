name: Setup
description: Node, dependencies and a Chrome for rendering the CV PDF and running the Playwright e2e tests.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # use the runner's Chrome below

    # GitHub-hosted Ubuntu runners ship Google Chrome. CHROMIUM_PATH is read by
    # scripts/build-pdf.ts and playwright.config.ts. If a runner image ever
    # lacks Chrome, install Playwright's Chromium instead (it needs no path).
    - name: Locate Chrome
      shell: bash
      run: |
        chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
        if [ -n "$chrome" ]; then
          echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          echo "Using $chrome ($("$chrome" --version))"
        else
          npx playwright install --with-deps chromium
        fi
